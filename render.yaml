services:
  - type: web
    name: orbitalaid-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://new-orbitalaid.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: orbitalaid-db
          property: connectionString
    autoDeploy: true

databases:
  - name: orbitalaid-db
    plan: free
